<!-- @dsCard group="Colors" viewport="700x170" name="Brand green" subtitle="--green-500 #00a676 is the logo green; --green-600/700 carry actions and links" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--surface-page);font-family:var(--font-sans)}
.sw{display:flex;flex-direction:column;gap:6px}.sw i{display:block;height:56px;border-radius:var(--radius-sm);border:1px solid rgba(11,26,48,.06)}
.sw b{font-family:var(--font-mono);font-size:10px;color:var(--text-strong);font-weight:400}
.sw s{font-family:var(--font-mono);font-size:10px;color:var(--text-faint);text-decoration:none}
.grid{display:grid;gap:10px}.row{display:flex;gap:10px;flex-wrap:wrap}
.note{font-size:12px;color:var(--text-muted);line-height:1.5}
</style></head><body><div class="grid" style="grid-template-columns:repeat(9,1fr)"><div class="sw"><i style="background:var(--green-50)"></i><b>green-50</b><s>#eaf7f2</s></div><div class="sw"><i style="background:var(--green-100)"></i><b>green-100</b><s>#cdece1</s></div><div class="sw"><i style="background:var(--green-200)"></i><b>green-200</b><s>#9ad9c3</s></div><div class="sw"><i style="background:var(--green-300)"></i><b>green-300</b><s>#63c9a7</s></div><div class="sw"><i style="background:var(--green-400)"></i><b>green-400</b><s>#2fb98d</s></div><div class="sw"><i style="background:var(--green-500)"></i><b>green-500</b><s>#00a676</s></div><div class="sw"><i style="background:var(--green-600)"></i><b>green-600</b><s>#00875f</s></div><div class="sw"><i style="background:var(--green-700)"></i><b>green-700</b><s>#006b4c</s></div><div class="sw"><i style="background:var(--green-800)"></i><b>green-800</b><s>#04503a</s></div></div></body></html>
