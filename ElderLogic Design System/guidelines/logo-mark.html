<!-- @dsCard group="Brand" viewport="700x200" name="Shield mark" subtitle="Favicon and compact header use. Minimum 16px" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--surface-page);font-family:var(--font-sans)}
.sw{display:flex;flex-direction:column;gap:6px}.sw i{display:block;height:56px;border-radius:var(--radius-sm);border:1px solid rgba(11,26,48,.06)}
.sw b{font-family:var(--font-mono);font-size:10px;color:var(--text-strong);font-weight:400}
.sw s{font-family:var(--font-mono);font-size:10px;color:var(--text-faint);text-decoration:none}
.grid{display:grid;gap:10px}.row{display:flex;gap:10px;flex-wrap:wrap}
.note{font-size:12px;color:var(--text-muted);line-height:1.5}
</style></head><body>
<div class="row" style="gap:24px;align-items:flex-end">
<div style="display:flex;flex-direction:column;gap:8px;align-items:center"><img src="../assets/favicon-512.svg" style="height:96px"><span style="font-family:var(--font-mono);font-size:10px;color:var(--text-faint)">96px</span></div><div style="display:flex;flex-direction:column;gap:8px;align-items:center"><img src="../assets/favicon-512.svg" style="height:64px"><span style="font-family:var(--font-mono);font-size:10px;color:var(--text-faint)">64px</span></div><div style="display:flex;flex-direction:column;gap:8px;align-items:center"><img src="../assets/favicon-512.svg" style="height:40px"><span style="font-family:var(--font-mono);font-size:10px;color:var(--text-faint)">40px</span></div><div style="display:flex;flex-direction:column;gap:8px;align-items:center"><img src="../assets/favicon-512.svg" style="height:24px"><span style="font-family:var(--font-mono);font-size:10px;color:var(--text-faint)">24px</span></div><div style="display:flex;flex-direction:column;gap:8px;align-items:center"><img src="../assets/favicon-512.svg" style="height:16px"><span style="font-family:var(--font-mono);font-size:10px;color:var(--text-faint)">16px</span></div>
</div>
<p class="note" style="margin-top:16px">Clear space equals the height of the house inside the shield. Never recolour, outline or rotate the mark.</p></body></html>
