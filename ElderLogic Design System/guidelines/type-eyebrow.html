<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--surface-page);font-family:var(--font-sans)}
.sw{display:flex;flex-direction:column;gap:6px}.sw i{display:block;height:56px;border-radius:var(--radius-sm);border:1px solid rgba(11,26,48,.06)}
.sw b{font-family:var(--font-mono);font-size:10px;color:var(--text-strong);font-weight:400}
.sw s{font-family:var(--font-mono);font-size:10px;color:var(--text-faint);text-decoration:none}
.grid{display:grid;gap:10px}.row{display:flex;gap:10px;flex-wrap:wrap}
.note{font-size:12px;color:var(--text-muted);line-height:1.5}
</style></head><body>
<div style="display:grid;gap:14px">
<div style="display:flex;align-items:center;gap:12px"><span style="width:24px;height:2px;background:var(--green-500)"></span><span style="font-size:12px;font-weight:600;letter-spacing:.11em;text-transform:uppercase;color:var(--green-700)">Updated monthly</span></div>
<span style="font-size:12px;font-weight:600;letter-spacing:.11em;text-transform:uppercase;color:var(--navy-700)">Built-in validation</span>
<div style="background:var(--surface-dark);padding:12px 14px;border-radius:var(--radius-md)"><span style="font-size:12px;font-weight:600;letter-spacing:.11em;text-transform:uppercase;color:var(--navy-200)">Historical AZDHS data</span></div>
</div></body></html>
