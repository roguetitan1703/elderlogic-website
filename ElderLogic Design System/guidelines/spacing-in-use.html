<!-- @dsCard group="Spacing" viewport="700x260" name="Rhythm in use" subtitle="Eyebrow 16 → headline 16 → lead 40 → content" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--surface-page);font-family:var(--font-sans)}
.sw{display:flex;flex-direction:column;gap:6px}.sw i{display:block;height:56px;border-radius:var(--radius-sm);border:1px solid rgba(11,26,48,.06)}
.sw b{font-family:var(--font-mono);font-size:10px;color:var(--text-strong);font-weight:400}
.sw s{font-family:var(--font-mono);font-size:10px;color:var(--text-faint);text-decoration:none}
.grid{display:grid;gap:10px}.row{display:flex;gap:10px;flex-wrap:wrap}
.note{font-size:12px;color:var(--text-muted);line-height:1.5}
</style></head><body>
<div style="border:1px dashed var(--border-default);border-radius:var(--radius-card);padding:24px">
<div style="display:flex;flex-direction:column;gap:16px">
<span style="font-size:12px;font-weight:600;letter-spacing:.11em;text-transform:uppercase;color:var(--green-700)">Interactive mapping</span>
<span style="font-family:var(--font-display);font-size:32px;line-height:1.18;letter-spacing:-.02em;font-weight:600;color:var(--text-strong)">One map instead of a contact list.</span>
<span style="font-size:16px;line-height:1.62;color:var(--text-body);max-width:52ch">Search by name or address and see every licensed community around it.</span>
</div>
<div style="height:40px"></div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:24px">
<div style="border-left:3px solid var(--green-500);padding-left:16px"><span style="font-size:12px;font-weight:600;letter-spacing:.11em;text-transform:uppercase;color:var(--navy-700)">Smart routing</span></div>
<div style="border-left:3px solid var(--green-500);padding-left:16px"><span style="font-size:12px;font-weight:600;letter-spacing:.11em;text-transform:uppercase;color:var(--navy-700)">Territory view</span></div>
</div></div></body></html>
