<!-- @dsCard group="Colors" viewport="700x300" name="Semantic aliases" subtitle="Reach for these, not the raw ramps" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--surface-page);font-family:var(--font-sans)}
.sw{display:flex;flex-direction:column;gap:6px}.sw i{display:block;height:56px;border-radius:var(--radius-sm);border:1px solid rgba(11,26,48,.06)}
.sw b{font-family:var(--font-mono);font-size:10px;color:var(--text-strong);font-weight:400}
.sw s{font-family:var(--font-mono);font-size:10px;color:var(--text-faint);text-decoration:none}
.grid{display:grid;gap:10px}.row{display:flex;gap:10px;flex-wrap:wrap}
.note{font-size:12px;color:var(--text-muted);line-height:1.5}
</style></head><body>
<div class="grid" style="grid-template-columns:1fr 1fr;gap:18px">
<div style="display:flex;align-items:center;gap:10px"><span style="width:26px;height:26px;border-radius:var(--radius-xs);background:var(--text-strong);border:1px solid rgba(11,26,48,.08);flex:0 0 auto"></span><span style="font-family:var(--font-mono);font-size:11px;color:var(--text-strong)">--text-strong</span><span style="font-family:var(--font-mono);font-size:11px;color:var(--text-faint)">navy-800</span></div><div style="display:flex;align-items:center;gap:10px"><span style="width:26px;height:26px;border-radius:var(--radius-xs);background:var(--text-body);border:1px solid rgba(11,26,48,.08);flex:0 0 auto"></span><span style="font-family:var(--font-mono);font-size:11px;color:var(--text-strong)">--text-body</span><span style="font-family:var(--font-mono);font-size:11px;color:var(--text-faint)">n-700</span></div><div style="display:flex;align-items:center;gap:10px"><span style="width:26px;height:26px;border-radius:var(--radius-xs);background:var(--text-muted);border:1px solid rgba(11,26,48,.08);flex:0 0 auto"></span><span style="font-family:var(--font-mono);font-size:11px;color:var(--text-strong)">--text-muted</span><span style="font-family:var(--font-mono);font-size:11px;color:var(--text-faint)">n-500</span></div><div style="display:flex;align-items:center;gap:10px"><span style="width:26px;height:26px;border-radius:var(--radius-xs);background:var(--text-link);border:1px solid rgba(11,26,48,.08);flex:0 0 auto"></span><span style="font-family:var(--font-mono);font-size:11px;color:var(--text-strong)">--text-link</span><span style="font-family:var(--font-mono);font-size:11px;color:var(--text-faint)">green-700</span></div><div style="display:flex;align-items:center;gap:10px"><span style="width:26px;height:26px;border-radius:var(--radius-xs);background:var(--surface-page);border:1px solid rgba(11,26,48,.08);flex:0 0 auto"></span><span style="font-family:var(--font-mono);font-size:11px;color:var(--text-strong)">--surface-page</span><span style="font-family:var(--font-mono);font-size:11px;color:var(--text-faint)">n-0</span></div><div style="display:flex;align-items:center;gap:10px"><span style="width:26px;height:26px;border-radius:var(--radius-xs);background:var(--surface-subtle);border:1px solid rgba(11,26,48,.08);flex:0 0 auto"></span><span style="font-family:var(--font-mono);font-size:11px;color:var(--text-strong)">--surface-subtle</span><span style="font-family:var(--font-mono);font-size:11px;color:var(--text-faint)">n-50</span></div><div style="display:flex;align-items:center;gap:10px"><span style="width:26px;height:26px;border-radius:var(--radius-xs);background:var(--surface-paper);border:1px solid rgba(11,26,48,.08);flex:0 0 auto"></span><span style="font-family:var(--font-mono);font-size:11px;color:var(--text-strong)">--surface-paper</span><span style="font-family:var(--font-mono);font-size:11px;color:var(--text-faint)">paper-100</span></div><div style="display:flex;align-items:center;gap:10px"><span style="width:26px;height:26px;border-radius:var(--radius-xs);background:var(--surface-dark);border:1px solid rgba(11,26,48,.08);flex:0 0 auto"></span><span style="font-family:var(--font-mono);font-size:11px;color:var(--text-strong)">--surface-dark</span><span style="font-family:var(--font-mono);font-size:11px;color:var(--text-faint)">navy-800</span></div><div style="display:flex;align-items:center;gap:10px"><span style="width:26px;height:26px;border-radius:var(--radius-xs);background:var(--border-hairline);border:1px solid rgba(11,26,48,.08);flex:0 0 auto"></span><span style="font-family:var(--font-mono);font-size:11px;color:var(--text-strong)">--border-hairline</span><span style="font-family:var(--font-mono);font-size:11px;color:var(--text-faint)">n-100</span></div><div style="display:flex;align-items:center;gap:10px"><span style="width:26px;height:26px;border-radius:var(--radius-xs);background:var(--border-default);border:1px solid rgba(11,26,48,.08);flex:0 0 auto"></span><span style="font-family:var(--font-mono);font-size:11px;color:var(--text-strong)">--border-default</span><span style="font-family:var(--font-mono);font-size:11px;color:var(--text-faint)">n-200</span></div><div style="display:flex;align-items:center;gap:10px"><span style="width:26px;height:26px;border-radius:var(--radius-xs);background:var(--accent-rule);border:1px solid rgba(11,26,48,.08);flex:0 0 auto"></span><span style="font-family:var(--font-mono);font-size:11px;color:var(--text-strong)">--accent-rule</span><span style="font-family:var(--font-mono);font-size:11px;color:var(--text-faint)">green-500</span></div><div style="display:flex;align-items:center;gap:10px"><span style="width:26px;height:26px;border-radius:var(--radius-xs);background:var(--border-focus);border:1px solid rgba(11,26,48,.08);flex:0 0 auto"></span><span style="font-family:var(--font-mono);font-size:11px;color:var(--text-strong)">--border-focus</span><span style="font-family:var(--font-mono);font-size:11px;color:var(--text-faint)">green-600</span></div>
</div></body></html>
