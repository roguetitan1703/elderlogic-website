<!-- @dsCard group="Colors" viewport="700x190" name="Form feedback" subtitle="Only for form validation and system messages — never applied to a home" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--surface-page);font-family:var(--font-sans)}
.sw{display:flex;flex-direction:column;gap:6px}.sw i{display:block;height:56px;border-radius:var(--radius-sm);border:1px solid rgba(11,26,48,.06)}
.sw b{font-family:var(--font-mono);font-size:10px;color:var(--text-strong);font-weight:400}
.sw s{font-family:var(--font-mono);font-size:10px;color:var(--text-faint);text-decoration:none}
.grid{display:grid;gap:10px}.row{display:flex;gap:10px;flex-wrap:wrap}
.note{font-size:12px;color:var(--text-muted);line-height:1.5}
</style></head><body><div class="grid" style="grid-template-columns:repeat(6,1fr)"><div class="sw"><i style="background:var(--feedback-error)"></i><b>feedback-error</b><s>#a8331f</s></div><div class="sw"><i style="background:var(--feedback-error-bg)"></i><b>feedback-error-bg</b><s>#fbf0ed</s></div><div class="sw"><i style="background:var(--feedback-notice)"></i><b>feedback-notice</b><s>#8a6d1f</s></div><div class="sw"><i style="background:var(--feedback-notice-bg)"></i><b>feedback-notice-bg</b><s>#faf5e8</s></div><div class="sw"><i style="background:var(--feedback-info)"></i><b>feedback-info</b><s>#1c4073</s></div><div class="sw"><i style="background:var(--feedback-info-bg)"></i><b>feedback-info-bg</b><s>#eef2f8</s></div></div><p class="note" style="margin-top:14px">No red/amber/green treatment is ever applied to a senior living home, a licence, an inspection or a violation count.</p></body></html>
