<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--surface-page);font-family:var(--font-sans)}
.sw{display:flex;flex-direction:column;gap:6px}.sw i{display:block;height:56px;border-radius:var(--radius-sm);border:1px solid rgba(11,26,48,.06)}
.sw b{font-family:var(--font-mono);font-size:10px;color:var(--text-strong);font-weight:400}
.sw s{font-family:var(--font-mono);font-size:10px;color:var(--text-faint);text-decoration:none}
.grid{display:grid;gap:10px}.row{display:flex;gap:10px;flex-wrap:wrap}
.note{font-size:12px;color:var(--text-muted);line-height:1.5}
</style></head><body>
<div style="font-family:var(--font-display);color:var(--text-strong)">
<div style="font-size:52px;line-height:1.06;letter-spacing:-.02em;font-weight:600">A shortlist of homes</div>
<div style="font-size:34px;line-height:1.18;letter-spacing:-.02em;font-weight:600;margin-top:8px">We don't rate homes.</div>
<div style="font-size:22px;line-height:1.28;margin-top:8px;font-weight:400">Every client. One place.</div>
</div>
<p class="note" style="margin-top:14px">--fs-display-1 / -2 / -3 and --fs-h1..h3. Weight 600 for headlines, 400 for quiet sub-heads. Never all-caps.</p></body></html>
