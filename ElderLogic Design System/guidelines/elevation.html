<!-- @dsCard group="Brand" viewport="700x200" name="Elevation" subtitle="Borders first. Shadow only signals lift or a floating device" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--surface-page);font-family:var(--font-sans)}
.sw{display:flex;flex-direction:column;gap:6px}.sw i{display:block;height:56px;border-radius:var(--radius-sm);border:1px solid rgba(11,26,48,.06)}
.sw b{font-family:var(--font-mono);font-size:10px;color:var(--text-strong);font-weight:400}
.sw s{font-family:var(--font-mono);font-size:10px;color:var(--text-faint);text-decoration:none}
.grid{display:grid;gap:10px}.row{display:flex;gap:10px;flex-wrap:wrap}
.note{font-size:12px;color:var(--text-muted);line-height:1.5}
</style></head><body>
<div class="row" style="gap:20px">
<div style="display:flex;flex-direction:column;gap:8px;align-items:center"><span style="width:130px;height:64px;background:var(--n-0);border:1px solid var(--border-hairline);border-radius:var(--radius-card);box-shadow:var(--shadow-hairline)"></span><span style="font-family:var(--font-mono);font-size:10px;color:var(--text-faint)">--shadow-hairline</span></div><div style="display:flex;flex-direction:column;gap:8px;align-items:center"><span style="width:130px;height:64px;background:var(--n-0);border:1px solid var(--border-hairline);border-radius:var(--radius-card);box-shadow:var(--shadow-1)"></span><span style="font-family:var(--font-mono);font-size:10px;color:var(--text-faint)">--shadow-1</span></div><div style="display:flex;flex-direction:column;gap:8px;align-items:center"><span style="width:130px;height:64px;background:var(--n-0);border:1px solid var(--border-hairline);border-radius:var(--radius-card);box-shadow:var(--shadow-2)"></span><span style="font-family:var(--font-mono);font-size:10px;color:var(--text-faint)">--shadow-2 · hover</span></div><div style="display:flex;flex-direction:column;gap:8px;align-items:center"><span style="width:130px;height:64px;background:var(--n-0);border:1px solid var(--border-hairline);border-radius:var(--radius-card);box-shadow:var(--shadow-3)"></span><span style="font-family:var(--font-mono);font-size:10px;color:var(--text-faint)">--shadow-3 · overlay</span></div>
</div>
<p class="note" style="margin-top:18px">Cards rest at zero elevation. --shadow-device is reserved for phone and desktop screenshots.</p></body></html>
