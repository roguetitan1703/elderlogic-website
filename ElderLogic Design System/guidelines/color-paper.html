<!-- @dsCard group="Colors" viewport="700x170" name="Paper surfaces" subtitle="The one warm surface. Alternate section background, never a text colour" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--surface-page);font-family:var(--font-sans)}
.sw{display:flex;flex-direction:column;gap:6px}.sw i{display:block;height:56px;border-radius:var(--radius-sm);border:1px solid rgba(11,26,48,.06)}
.sw b{font-family:var(--font-mono);font-size:10px;color:var(--text-strong);font-weight:400}
.sw s{font-family:var(--font-mono);font-size:10px;color:var(--text-faint);text-decoration:none}
.grid{display:grid;gap:10px}.row{display:flex;gap:10px;flex-wrap:wrap}
.note{font-size:12px;color:var(--text-muted);line-height:1.5}
</style></head><body><div class="grid" style="grid-template-columns:repeat(3,1fr)"><div class="sw"><i style="background:var(--paper-50)"></i><b>paper-50</b><s>#faf8f4</s></div><div class="sw"><i style="background:var(--paper-100)"></i><b>paper-100</b><s>#f5f1e9</s></div><div class="sw"><i style="background:var(--paper-200)"></i><b>paper-200</b><s>#e9e2d4</s></div></div><p class="note" style="margin-top:14px">Two background colours per page maximum: white or paper, plus navy for one dark section.</p></body></html>
