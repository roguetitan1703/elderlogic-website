<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--surface-page);font-family:var(--font-sans)}
.sw{display:flex;flex-direction:column;gap:6px}.sw i{display:block;height:56px;border-radius:var(--radius-sm);border:1px solid rgba(11,26,48,.06)}
.sw b{font-family:var(--font-mono);font-size:10px;color:var(--text-strong);font-weight:400}
.sw s{font-family:var(--font-mono);font-size:10px;color:var(--text-faint);text-decoration:none}
.grid{display:grid;gap:10px}.row{display:flex;gap:10px;flex-wrap:wrap}
.note{font-size:12px;color:var(--text-muted);line-height:1.5}
</style></head><body><div class="grid" style="grid-template-columns:repeat(11,1fr)"><div class="sw"><i style="background:var(--n-0)"></i><b>n-0</b><s>#ffffff</s></div><div class="sw"><i style="background:var(--n-50)"></i><b>n-50</b><s>#f4f6f9</s></div><div class="sw"><i style="background:var(--n-100)"></i><b>n-100</b><s>#e8ecf2</s></div><div class="sw"><i style="background:var(--n-200)"></i><b>n-200</b><s>#d5dbe4</s></div><div class="sw"><i style="background:var(--n-300)"></i><b>n-300</b><s>#b7c0cd</s></div><div class="sw"><i style="background:var(--n-400)"></i><b>n-400</b><s>#8b96a6</s></div><div class="sw"><i style="background:var(--n-500)"></i><b>n-500</b><s>#667283</s></div><div class="sw"><i style="background:var(--n-600)"></i><b>n-600</b><s>#4b5666</s></div><div class="sw"><i style="background:var(--n-700)"></i><b>n-700</b><s>#35404e</s></div><div class="sw"><i style="background:var(--n-800)"></i><b>n-800</b><s>#212a36</s></div><div class="sw"><i style="background:var(--n-900)"></i><b>n-900</b><s>#131a23</s></div></div></body></html>
